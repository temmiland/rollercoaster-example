name: Mobile builds

# Builds and smoke-tests the Android and iOS platform modules. This exists because "compiles"
# and "actually runs" are different claims on mobile - see docs/plan.md in rollercoaster-editor:
# an earlier missing-natives bug compiled and installed fine on both platforms and only crashed
# on the very first frame. Both jobs install the built app on a real emulator/simulator and
# check the process is still alive a few seconds after launch, not just that the build succeeded.
#
# Assumes the rollercoaster engine lives in a sibling repository under the same GitHub owner,
# matching this project's composite build (settings.gradle: includeBuild('../rollercoaster')).
# Adjust the "repository:" line below if that's not where it ends up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out example-game
        uses: actions/checkout@v4
        with:
          path: example-game

      - name: Check out rollercoaster (composite build dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/rollercoaster
          path: rollercoaster

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM for the emulator (see reactivecircus/android-emulator-runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and smoke-test the debug APK on a headless emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: example-game
          script: |
            ./gradlew :platforms:android:installDebug --no-daemon
            adb shell am start -W -n land.temmi.rollercoaster.example/land.temmi.rollercoaster.android.AndroidLauncher
            sleep 5
            adb shell pidof land.temmi.rollercoaster.example || { echo "App is not running 5s after launch"; exit 1; }

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: example-game-android-debug
          path: example-game/platforms/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - name: Check out example-game
        uses: actions/checkout@v4
        with:
          path: example-game

      - name: Check out rollercoaster (composite build dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/rollercoaster
          path: rollercoaster

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Simulator builds don't need the device signing platforms/ios/build.gradle otherwise
      # requires (iosSkipSigning = false, archs = 'arm64' is for launchIOSDevice).
      - name: Build and smoke-test on the iPhone simulator
        working-directory: example-game
        run: |
          ./gradlew :platforms:ios:launchIPhoneSimulator --no-daemon &
          GRADLE_PID=$!
          sleep 60
          APP_PID=$(xcrun simctl spawn booted launchctl list 2>/dev/null | grep -i rollercoaster | awk '{print $1}' || true)
          if [ -z "$APP_PID" ]; then
            echo "App does not appear to be running on the simulator after 60s"
            kill $GRADLE_PID 2>/dev/null || true
            exit 1
          fi
          kill $GRADLE_PID 2>/dev/null || true
