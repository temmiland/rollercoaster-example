plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    api 'land.temmi:rollercoaster:0.1.0'
}

sourceSets {
    renderTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    renderTestImplementation.extendsFrom implementation
    renderTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    renderTestImplementation libs.gdx.backend.lwjgl3
    renderTestImplementation "com.badlogicgames.gdx:gdx-platform:${libs.versions.gdx.get()}:natives-desktop"
}

tasks.register('renderSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks the example world in a desktop OpenGL context.'
    classpath = sourceSets.renderTest.runtimeClasspath
    mainClass = 'land.temmi.trackside.lwjgl3.RenderSmokeTest'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}

tasks.register('lightingSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Checks cast shadows, local lights and emission in a desktop OpenGL context.'
    classpath = sourceSets.renderTest.runtimeClasspath
    mainClass = 'land.temmi.trackside.lwjgl3.LightingSmokeTest'
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}
